name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python automation.py verify --run-dir example-output/runs/sample-manual
